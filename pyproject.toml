[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpim-probabilistic-error"
version = "1.0.0"
description = "Source code for DPIM probabilistic error estimation in stochastic mechanics"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Guanyao Wang"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "sympy>=1.12,<2", "threadpoolctl>=3.4,<4"]

[project.urls]
Repository = "https://github.com/wangguanyao4-netizen/DPIM_CI_open_source_code"

[tool.setuptools.packages.find]
where = ["python"]

